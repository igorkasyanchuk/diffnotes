# Fly.io: `fly launch --copy-config --no-deploy`, `fly volumes create diffnotes_data --size 1`, then
# `fly deploy --ha=false` (exactly one machine: DiffNotes is a single instance). See docs/deploy.md.
app = "diffnotes" # app names are global on Fly: pick your own
primary_region = "fra"

[env]
  # every variable: docs/install.md (Environment); secrets go in `fly secrets set`, e.g. BUGSINK_DSN, GITHUB_CLIENT_SECRET
  PUBLIC_URL = "https://diffnotes.fly.dev" # your app's https:// origin
  ADMIN_EMAIL = "you@company.com"
  RETENTION_DAYS = "365"
  # MAX_FILE_MB = "1"
  # MAX_VIDEO_MB = "2"
  # MAX_FILES = "30"
  # MAX_ANNOTATIONS = "500"
  # MAX_PULL_MB = "20"
  # MAX_BODY_KB = "1024"
  # MAX_ACCOUNT_MB = "1024"
  # MAX_PULLS = "1000"
  # MAX_ACCOUNTS = "10"
  # MIN_FREE_DISK_MB = "100"
  # GITHUB_CLIENT_ID = "" # sign in with GitHub (docs/accounts.md); its secret: fly secrets set GITHUB_CLIENT_SECRET=…
  # ALLOW_SIGNUP = "1"
  # DEMO_PR = "owner/name#12"
  # STORAGE_TYPE = "b2" # file storage (docs/storage.md): disk, b2, r2, s3 or minio, with that provider's variables;
  # B2_REGION = "us-west-004"   # keys as secrets: fly secrets set B2_KEY_ID=… B2_APPLICATION_KEY=…
  # B2_BUCKET = "diffnotes-files"
  # STORAGE_PREFIX = "diffnotes/"
  # UMAMI_SCRIPT = ""
  # UMAMI_WEBSITE_ID = ""

[mounts]
  source = "diffnotes_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop" # idle machines stop; expired notes are purged when one starts and hourly while it runs
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
