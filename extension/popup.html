<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #16181d; background: #f6f5f1; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    label { display: grid; gap: 3px; margin-bottom: 8px; color: #4a505c; font-size: 12px; }
    input { font: 13px system-ui; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { font: 500 13px system-ui; padding: 7px 12px; border-radius: 6px; border: 1px solid #16181d; background: #16181d; color: #fff; cursor: pointer; }
    button.plain { background: #fff; color: #16181d; border-color: #ccc; }
    .error { color: #c9362b; margin-top: 8px; }
    .hint { color: #858a94; font-size: 12px; }
    h2 { font-size: 13px; margin: 12px 0 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    .row button { padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1><img src="icon32.png" width="18" height="18" alt="" />DiffNotes</h1>
  <div id="list"></div>
  <form id="connect">
    <h2 id="add-title">Connect a server</h2>
    <label>Server, or the line from Settings <input id="server" placeholder="https://diffnotes.example.com" required /></label>
    <label>Token <input id="token" type="password" placeholder="dn_…" required /></label>
    <button id="submit">Connect</button>
    <p class="hint">Make a token on your server's <a id="settings" href="#" target="_blank">Settings</a> page and paste the one line it shows for the extension. Notes from every connected server show on GitHub, GitLab and Bitbucket.</p>
  </form>
  <div class="error" id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
