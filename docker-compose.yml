# DiffNotes: one container, one volume. `docker compose up -d`, then `docker compose logs | grep "first admin"`.
# Every variable is explained in docs/install.md (Environment). Run exactly one instance: see docs/install.md.
services:
  diffnotes:
    build: .
    image: diffnotes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - diffnotes:/data
    environment:
      # server
      PUBLIC_URL: https://reviews.company.com   # your https:// origin
      ADMIN_EMAIL: you@company.com              # the first admin, only used when there are no users yet
      RETENTION_DAYS: 30
      # ADMIN_PASSWORD: ""                      # default: random, printed once in the logs
      # PORT: 3000
      # DATA_DIR: /data
      # limits
      # MAX_FILE_MB: 1
      # MAX_VIDEO_MB: 2
      # MAX_FILES: 30
      # MAX_ANNOTATIONS: 500
      # MAX_PULL_MB: 20
      # MAX_BODY_KB: 1024
      # MAX_ACCOUNT_MB: 1024
      # MAX_PULLS: 1000
      # MAX_ACCOUNTS: 10
      # MIN_FREE_DISK_MB: 100
      # security
      # SESSION_SECRET: ""                      # default: random, kept in /data
      # ENCRYPTION_KEY: ""                      # default: random, kept in /data
      # CLOUDFLARE_ONLY: 1
      # integrations (all off unless set; use your own)
      # BUGSINK_DSN: ""
      # GITHUB_CLIENT_ID: ""                    # sign in with GitHub (docs/accounts.md)
      # GITHUB_CLIENT_SECRET: ""
      # ALLOW_SIGNUP: 1                         # anyone with GitHub may sign up
      # DEMO_PR: owner/name#12                  # a live demo PR every signed-in user can read (/demo)
      # UMAMI_SCRIPT: ""
      # UMAMI_WEBSITE_ID: ""
      # file storage (docs/storage.md): disk by default, or one provider's bucket
      # STORAGE_TYPE: b2                        # disk, b2, r2, s3 or minio
      # B2_REGION: us-west-004                  # b2: the part after "s3." in the bucket's Endpoint
      # B2_BUCKET: diffnotes-files
      # B2_KEY_ID: ""
      # B2_APPLICATION_KEY: ""
      # R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY      r2
      # AWS_REGION / AWS_BUCKET / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY      s3
      # MINIO_ENDPOINT / MINIO_BUCKET / MINIO_ACCESS_KEY / MINIO_SECRET_KEY      minio (or any S3-compatible)
      # STORAGE_PREFIX: diffnotes/

volumes:
  diffnotes:
